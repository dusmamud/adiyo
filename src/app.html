<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#0a2540" />
		<link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/plus-jakarta-sans-400.woff2" />
		<link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/plus-jakarta-sans-700.woff2" />
		<meta
			name="description"
			content="Adiyo is Generative AI for frontline sales managers — proprietary GPT-4 insights across every sales conversation, so you drive more revenue and hit forecasts."
		/>
		<script>
			// Motion gate: only hide reveal elements when the visitor allows motion.
			// Runs before paint; no-JS / reduced-motion visitors see everything static.
			if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
				document.documentElement.classList.add('motion-ok');
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
